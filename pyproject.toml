[project]
name = "company-knowledge-rag"
version = "0.1.0"
description = "Production-oriented RAG service for internal company documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117",
  "google-genai>=1.30,<2",
  "httpx>=0.28,<1",
  "instructor>=1.12,<2",
  # instructor needs jsonref to flatten $defs for the Gemini response schema.
  "jsonref>=1.1,<2",
  # GeminiRotatingRunnable subclasses Runnable so the key pool plugs into LCEL/LangGraph.
  "langchain-core>=1.5,<2",
  "langfuse>=3.3.1,<4",
  "openai>=1.99,<2",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<6",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.16,<1.17",
  "rank-bm25>=0.2.2,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
company-rag-serve = "cli:serve"
company-rag-ingest = "cli:ingest"
company-rag-evaluate = "cli:evaluate"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]
eval = ["ragas>=0.3,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --basetemp=.pytest_tmp"
markers = [
  "unit: isolated deterministic test",
  "component: multiple internal components with fake external dependencies",
  "integration: requires external infrastructure",
  "smoke: critical MVP workflow",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["instructor.*"]
ignore_missing_imports = true
