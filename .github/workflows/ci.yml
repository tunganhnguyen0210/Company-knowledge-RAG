name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
          enable-cache: true
      - run: uv sync --locked --group dev --no-group eval
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=src --cov-report=term-missing
      - run: docker compose config --quiet
      - run: docker build --tag company-knowledge-rag:ci .
