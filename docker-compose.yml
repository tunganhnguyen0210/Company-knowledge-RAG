services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      RAG_ENVIRONMENT: production
      RAG_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: ${RAG_QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rag_data:
  qdrant_data:
