services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/data
    restart: unless-stopped

  # Local Qdrant is opt-in: `docker compose --profile local-qdrant up -d`.
  # Without the profile nothing here starts, and QDRANT_URL from .env decides
  # which cluster the API talks to.
  qdrant:
    image: qdrant/qdrant:v1.18.3
    profiles: ["local-qdrant"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rag_data:
  qdrant_data:
